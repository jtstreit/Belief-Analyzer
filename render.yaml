# Render Blueprint — Belief Analyzer API (Express 5 + Kimi Code API)
# Cloud-hosts artifacts/api-server so the phone app reaches Vera with the PC off.
# LLM route: veraComplete -> Kimi Code API (model k3) on Jackson's Kimi
# subscription OAuth — KIMI_REFRESH_TOKEN refreshes short-lived access tokens
# in-process. Zero API spend; Claude Max OAuth route retired 2026-08-09.
# Never set AI_INTEGRATIONS_OPENAI_BASE_URL here: that selects the OpenAI-compat
# backend, which is the local mock-LLM verification seam only.
services:
  - type: web
    name: belief-analyzer-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.16.0"
      # Kimi subscription OAuth refresh token (from `kimi login` device flow) —
      # paste in dashboard. Vera runs on Kimi K3 with this credential.
      - key: KIMI_REFRESH_TOKEN
        sync: false
      # Dedicated Render Postgres (belief-analyzer-db) — link via "Add from database".
      - key: DATABASE_URL
        sync: false
      # Shared ingest credential used only by the server-to-server LifeOps pull.
      - key: SENTINEL_INGEST_TOKEN
        sync: false
